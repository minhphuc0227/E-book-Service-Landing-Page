<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ cá nhân - BOOKLY</title>
    <meta
      name="description"
      content="Xem và cập nhật thông tin tài khoản BOOKLY của bạn."
    />
    <link rel="stylesheet" href="./dist/output.css" />
  </head>

  <body>
    <header class="site-header sticky top-0 z-50">
      <nav
        aria-label="Thanh điều hướng chính"
        class="mx-auto flex min-h-[72px] w-full max-w-[1280px] flex-wrap items-center justify-between gap-2 px-5 py-4 sm:gap-4 lg:h-[85px] lg:flex-nowrap lg:gap-8 lg:px-5 lg:py-6"
      >
        <a
          href="index.html"
          aria-label="BOOKLY - Trang chủ"
          class="flex h-9 w-auto shrink-0 items-center gap-1 sm:w-[155px] sm:gap-3"
        >
          <img
            src="assets/img/bookly-logo.png"
            alt="BOOKLY"
            class="h-7 w-auto object-contain sm:h-9"
          />
          <span class="font-body text-xl font-semibold leading-9 sm:text-2xl">
            BOOKLY
          </span>
        </a>
        <div
          data-auth-nav
          class="flex shrink-0 items-center gap-2 text-xs sm:text-sm"
        ></div>
      </nav>
    </header>

    <main class="section">
      <section class="mx-auto max-w-3xl">
        <p class="eyebrow">Tài khoản BOOKLY</p>
        <h1 class="mt-2 text-3xl font-black">Hồ sơ cá nhân</h1>
        <p class="mt-3 text-sm text-ink/60">
          Cập nhật thông tin của bạn. Các mục có dấu
          <span class="font-semibold text-red-600">*</span> là bắt buộc.
        </p>

        <form id="profile-form" class="card mt-8 space-y-6">
          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <label for="profile-username" class="field-label">
                Tên người dùng
                <span class="text-red-600" aria-hidden="true">*</span>
                <span class="sr-only">, bắt buộc</span>
              </label>
              <input
                id="profile-username"
                name="username"
                type="text"
                autocomplete="username"
                minlength="3"
                maxlength="30"
                class="field-input"
                required
                aria-describedby="profile-username-error"
              />
              <p id="profile-username-error" class="field-error" data-error-for="username" aria-live="polite"></p>
            </div>
            <div>
              <label for="profile-full-name" class="field-label">
                Họ và tên
                <span class="text-red-600" aria-hidden="true">*</span>
                <span class="sr-only">, bắt buộc</span>
              </label>
              <input
                id="profile-full-name"
                name="fullName"
                type="text"
                autocomplete="name"
                class="field-input"
                required
                aria-describedby="profile-fullName-error"
              />
              <p id="profile-fullName-error" class="field-error" data-error-for="fullName" aria-live="polite"></p>
            </div>
            <div>
              <label for="profile-phone" class="field-label">
                Số điện thoại
                <span class="text-red-600" aria-hidden="true">*</span>
                <span class="sr-only">, bắt buộc</span>
              </label>
              <input
                id="profile-phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                class="field-input"
                required
                aria-describedby="profile-phone-error"
              />
              <p id="profile-phone-error" class="field-error" data-error-for="phone" aria-live="polite"></p>
            </div>
            <div>
              <label for="profile-birth-date" class="field-label">
                Ngày sinh
                <span class="text-red-600" aria-hidden="true">*</span>
                <span class="sr-only">, bắt buộc</span>
              </label>
              <input
                id="profile-birth-date"
                name="birthDate"
                type="date"
                autocomplete="bday"
                class="field-input"
                required
                aria-describedby="profile-birthDate-error"
              />
              <p id="profile-birthDate-error" class="field-error" data-error-for="birthDate" aria-live="polite"></p>
            </div>
            <div>
              <label for="profile-address" class="field-label">
                Địa chỉ
                <span class="text-red-600" aria-hidden="true">*</span>
                <span class="sr-only">, bắt buộc</span>
              </label>
              <input
                id="profile-address"
                name="address"
                type="text"
                autocomplete="street-address"
                class="field-input"
                required
                aria-describedby="profile-address-error"
              />
              <p id="profile-address-error" class="field-error" data-error-for="address" aria-live="polite"></p>
            </div>
          </div>

          <fieldset>
            <legend class="field-label">
              Thể loại sách yêu thích
              <span class="text-red-600" aria-hidden="true">*</span>
              <span class="sr-only">, bắt buộc</span>
            </legend>
            <div class="grid grid-cols-2 gap-3 text-sm sm:grid-cols-3">
              <label class="flex items-center gap-2">
                <input type="checkbox" name="favoriteGenres" value="Văn học" class="accent-brand-600" />
                Văn học
              </label>
              <label class="flex items-center gap-2">
                <input type="checkbox" name="favoriteGenres" value="Kinh doanh" class="accent-brand-600" />
                Kinh doanh
              </label>
              <label class="flex items-center gap-2">
                <input type="checkbox" name="favoriteGenres" value="Kỹ năng sống" class="accent-brand-600" />
                Kỹ năng sống
              </label>
              <label class="flex items-center gap-2">
                <input type="checkbox" name="favoriteGenres" value="Khoa học" class="accent-brand-600" />
                Khoa học
              </label>
              <label class="flex items-center gap-2">
                <input type="checkbox" name="favoriteGenres" value="Thiếu nhi" class="accent-brand-600" />
                Thiếu nhi
              </label>
              <label class="flex items-center gap-2">
                <input type="checkbox" name="favoriteGenres" value="Lịch sử" class="accent-brand-600" />
                Lịch sử
              </label>
            </div>
            <p id="profile-genres-error" class="field-error" data-error-for="favoriteGenres" aria-live="polite"></p>
          </fieldset>

          <p
            id="profile-message"
            class="min-h-5 text-sm"
            role="status"
            aria-live="polite"
          ></p>
          <div class="flex flex-wrap justify-end gap-3">
            <button
              type="button"
              data-reset-profile
              class="btn btn-ghost"
            >
              Khôi phục thông tin đã lưu
            </button>
            <button type="submit" class="btn btn-primary">
              Lưu thông tin
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="assets/js/auth.js?v=2" defer></script>
  </body>
</html>
